# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Skill selection and output checks

prompts:
  - '{{ request }}'

providers:
  - id: anthropic:claude-agent-sdk
    config:
      model: "{{ env.EVAL_MODEL | default('sonnet') }}"
      # workspace/.claude/skills links to every public skill, so each case
      # also checks that the right one is picked.
      working_dir: ./workspace
      setting_sources: ['project']
      skills: all
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      append_allowed_tools: ['Bash', 'Write', 'WebSearch', 'WebFetch']
      max_budget_usd: 5
      # The SDK also takes CLAUDE_CODE_OAUTH_TOKEN, a subscription token from
      # `claude setup-token`, so an API key is optional.
      apiKeyRequired: false

evaluateOptions:
  # Cases share the workspace and the waiver sweep writes data files into it.
  maxConcurrency: 1

tests:
  - description: waiver sweep runs from the user's context file
    vars:
      request: Run my waiver sweep.
    assert:
      - type: skill-used
        value: fantasy-waiver-sweep
      - type: javascript
        value: '/^Subject: Waiver sweep Wk \d+/m.test(output)'
      - type: javascript
        value: '/^[A-Z]+: (Add |No move)/m.test(output)'
      - type: javascript
        value: '!/[\u2013\u2014]/.test(output)'
      - type: javascript
        value: '!/^#/m.test(output)'

  # Week 10 of 2026: OFFICE has no TE (Loveland on bye), Deebo Samuel is Out
  # with an open IR slot, and the roster already has five RBs, one of them
  # McCaffrey's backup. Barner plays every snap but scores about 6 a game behind
  # a backup QB, so he loses to the other TEs on points. The saved lineup also
  # starts Gainwell (TB) and Lemon (PHI), both on bye, with Pollard and DJ Moore
  # on the bench.
  - description: the waiver sweep fills the lineup hole first and keeps the handcuff
    vars:
      request: >-
        Run my waiver sweep from the snapshot in fantasy/2026-wk10. Use only the
        files there, and don't fetch anything or search the web. The snapshot
        README is the context, so ignore ~/.agents/context.
    assert:
      - type: skill-used
        value: fantasy-waiver-sweep
      - type: javascript
        value: '/^OFFICE: Add [^(\n]+\(TE, [A-Z]{2,3}\)/m.test(output)'
      - type: javascript
        value: '!/^OFFICE: Add A\.?J\.? Barner/m.test(output)'
      - type: javascript
        value: '/^OFFICE: Add [^\n]* over /m.test(output)'
      - type: javascript
        value: '!/^OFFICE:[^\n]*\bdrop (Kaelon )?Black\b|^\| OFFICE \| Drop \| Kaelon Black/im.test(output)'
      - type: javascript
        value: '/^OFFICE:[^\n]*Samuel[^\n]*\bIR\b/m.test(output)'
      - type: javascript
        value: '(output.match(/^DEF: /gm) || []).length === 2'
      - type: javascript
        value: '(output.match(/^K: /gm) || []).length === 1'
      - type: javascript
        value: '(output.match(/^DEF: [^\n]*giveaway/gm) || []).length === 2'
      # FAMILY uses rolling priority, and a DEF stream never spends it.
      - type: javascript
        value: '!/^DEF: [^\n]*use priority|^\| FAMILY \| Add \| [^|]*DEF[^|]*\| [^|]*priority/im.test(output)'
      - type: javascript
        value: '/^MOVES\n\| League \| Move \| Player \| Price \| By \|$/m.test(output)'
      - type: javascript
        value: '/^\| OFFICE \| IR \| (Deebo )?Samuel[^\n]*\| now \|$/m.test(output)'
      - type: javascript
        value: '/^\| OFFICE \| Add \| [^|]+\(TE, [A-Z]{2,3}\)/m.test(output)'
      # Every move is in the table, including putting the new TE in the
      # lineup and benching the starters on bye.
      - type: javascript
        value: '/^\| OFFICE \| Start \| [^|]+\(TE, [A-Z]{2,3}\) at TE/m.test(output)'
      - type: javascript
        value: '["Loveland", "Gainwell", "Lemon"].every(n => new RegExp(`^\\| OFFICE \\| Bench \\| [^|]*${n}`, "m").test(output))'
      - type: javascript
        value: '!/[\u2013\u2014]/.test(output)'

  - description: a start/sit question goes to start-sit, not the waiver sweep
    vars:
      request: Half PPR, flex this week is Jaylen Waddle or Rome Odunze. Who do I start? Keep it short.
    assert:
      - type: skill-used
        value: fantasy-start-sit
      - type: not-skill-used
        value: fantasy-waiver-sweep

  # FAMILY's saved lineup starts Swift (CHI) and Lemon (PHI), both on bye, and
  # Diggs plays Thursday. Pollard, Hall and Coker are healthy on the bench, so
  # both holes fill from the bench without a pickup.
  - description: start-sit from a Sleeper league fills the bye holes and ends with a moves table
    vars:
      request: >-
        Who should I start this week in FAMILY? Use only the files in
        fantasy/2026-wk10, and don't fetch anything or search the web. The
        README there is the context, so ignore ~/.agents/context.
    assert:
      - type: skill-used
        value: fantasy-start-sit
      - type: not-skill-used
        value: fantasy-waiver-sweep
      - type: javascript
        value: '/^MOVES\n\| League \| Move \| Player \| Price \| By \|$/m.test(output)'
      - type: javascript
        value: '["Swift", "Lemon"].every(n => new RegExp(`^\\| FAMILY \\| Bench \\| [^|]*${n}`, "m").test(output))'
      - type: javascript
        value: '!/^\| FAMILY \| Start \| [^|]*(Swift|Lemon|Waddle|Worthy|Samuel)/m.test(output)'
      # The deadline is the earlier kickoff of the two players in a swap.
      - type: javascript
        value: |-
          const rows = output.match(/^\| FAMILY \| Start \|.*$/gm) || [];
          return rows.length >= 2 && rows.every(r => /\| (Thu|Sat|Sun|Mon) \d{1,2}:\d{2} (AM|PM) ET \|$/.test(r));
      - type: javascript
        value: |-
          const rows = output.match(/^\| FAMILY \| (Start|Bench) \| [^|]*\((QB|RB|WR|TE), (WAS|NYG)\).*$/gm) || [];
          return rows.every(r => /\| Thu 8:15 PM ET \|$/.test(r));
      # The bench fills both holes, and drops belong to the waiver sweep.
      - type: javascript
        value: '!/^\| FAMILY \| (Add|Drop) \|/m.test(output) && !/^Subject:/m.test(output)'
      - type: javascript
        value: '!/[\u2013\u2014]/.test(output)'

  # The request that started this: one ask for lineups and waivers in both
  # leagues. The sweep runs, start-sit runs on the lineup, and the answer ends
  # with one table of every move. NE plays at DET at 9:30 AM ET Sunday, so a
  # Patriots or Lions player in a swap is due by then, or by Thursday night when
  # the other player in the swap plays WAS at NYG.
  - description: a start/sit and waivers request runs both skills and ends with one moves table
    vars:
      request: >-
        Start sit waivers for both my sleeper teams. Use only the files in
        fantasy/2026-wk10, and don't fetch anything or search the web. The
        README there is the context, so ignore ~/.agents/context.
    assert:
      - type: skill-used
        value: fantasy-waiver-sweep
      - type: skill-used
        value: fantasy-start-sit
      - type: javascript
        value: '(output.match(/^MOVES$/gm) || []).length === 1 && /^MOVES\n\| League \| Move \| Player \| Price \| By \|$/m.test(output)'
      - type: javascript
        value: '/^\| OFFICE \| Add \| [^|]+\(TE, [A-Z]{2,3}\)/m.test(output) && /^\| OFFICE \| Start \| [^|]+\(TE, [A-Z]{2,3}\) at TE/m.test(output)'
      - type: javascript
        value: '[["OFFICE", "Loveland"], ["OFFICE", "Gainwell"], ["OFFICE", "Lemon"], ["FAMILY", "Swift"], ["FAMILY", "Lemon"]].every(([l, n]) => new RegExp(`^\\| ${l} \\| Bench \\| [^|]*${n}`, "m").test(output))'
      - type: javascript
        value: '!/^\| [A-Z]+ \| Start \| [^|]*(Swift|Lemon|Gainwell|Loveland|Waddle|Worthy|Samuel)/m.test(output)'
      # One player per row.
      - type: javascript
        value: '!/^\| [A-Z]+ \| [A-Za-z]+ \| [^|(]*,/m.test(output)'
      - type: javascript
        value: |-
          const rows = output.match(/^\| [A-Z]+ \| (Start|Bench) \| [^|]*\((QB|RB|WR|TE), (NE|DET)\).*$/gm) || [];
          return rows.every(r => /\| (Sun 9:30 AM|Thu 8:15 PM) ET \|$/.test(r));
      - type: javascript
        value: '!/[\u2013\u2014]/.test(output)'

  - description: a style review of a file in the workspace goes to code-quality-review
    vars:
      request: Do a code quality review of names.go for idioms, style, and design. Findings only, don't edit it.
    assert:
      - type: skill-used
        value: code-quality-review
      - type: javascript
        value: "!(context.providerResponse?.metadata?.toolCalls || []).some(t => ['Edit', 'Write'].includes(t.name))"

  - description: golf sim numbers come from the Sim table, and an unchanged screen gets none
    vars:
      request: >-
        golf/sessions/2026-10-30-1815-5e1f0a2c in this workspace is a golf-etl session.
        What did the sim show for each swing? Reply with one line per swing and nothing else,
        either `swing-NN: <club mph>, <ball mph>, <carry raw yd>` with numbers only and no units,
        or `swing-NN: none`.
    assert:
      - type: skill-used
        value: golf-swing-analysis
      - type: javascript
        value: '/^`?swing-01: 94\.6, 137\.6, 216\.8`?$/m.test(output)'
      - type: javascript
        value: '/^`?swing-02: none`?$/m.test(output)'
