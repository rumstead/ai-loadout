name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install skills-ref==0.1.1
      - name: Validate skills against the Agent Skills spec
        run: |
          for d in skills/*/; do agentskills validate "$d"; done
      # gh skill is in preview, so its verdict is informational.
      - name: gh skill publish --dry-run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate --strict .
      - name: Validate and test each mod
        run: |
          for m in mods/*/; do
            claude plugin validate --strict "$m"
            claude plugin test "$m"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
